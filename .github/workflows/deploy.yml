name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Deploy berurutan: dua push ke main yang berdekatan tidak boleh saling
# menyalip saat menulis ke server yang sama.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===================================================================
  # Build check
  # ===================================================================
  backend-check:
    name: Backend Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.mod ada di backend/, bukan root repo.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Compile
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

  frontend-check:
    name: Frontend Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [tenant, platform-admin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install
        working-directory: frontend/${{ matrix.app }}
        run: npm ci

      - name: Build
        working-directory: frontend/${{ matrix.app }}
        run: npm run build

  # ===================================================================
  # Build & push image
  # ===================================================================
  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build context backend/ dengan dockerfile di dalamnya — sama seperti
          # `make docker` dan service api di docker/docker-compose.yml.
          - image: hris-api
            context: backend
            dockerfile: backend/docker/Dockerfile
          - image: hris-tenant-web
            context: frontend/tenant
            dockerfile: frontend/tenant/Dockerfile
          - image: hris-admin-web
            context: frontend/platform-admin
            dockerfile: frontend/platform-admin/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR menolak nama repository yang mengandung huruf kapital, sedangkan
      # github.repository_owner mempertahankan casing aslinya.
      - name: Normalize owner to lowercase
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ===================================================================
  # Deploy
  # ===================================================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: images
    environment: hris-dev
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hanya compose file yang disalin. File .env dikelola manual di server
      # (lihat docker/.env.prod.example) dan sengaja tidak pernah dikirim dari
      # CI — isinya kredensial DB super-user dan encryption key.
      #
      # Migrasi tidak ikut disalin: seluruh .sql ditanam di dalam binary lewat
      # //go:embed, jadi versi migrasi selalu mengikuti image yang berjalan.
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker/docker-compose.prod.yml
          target: ${{ secrets.SERVER_APP_DIR }}
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,APP_DIR
          script: |
            set -euo pipefail
            cd "$APP_DIR"

            # Image di GHCR default-nya private; server perlu login untuk pull.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Data postgres & uploads memakai bind mount (./data/...), bukan
            # named volume — lokasinya tetap di $APP_DIR, tidak ikut hilang
            # kalau ada yang menjalankan `docker compose down -v`. mkdir -p
            # idempotent: aman dijalankan berkali-kali, tidak menyentuh isi
            # yang sudah ada.
            mkdir -p data/postgres data/uploads

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

            # Saat start, service api menjalankan migrasi SQL platform lalu
            # AutoMigrate platform (cmd/server/main.go:1517-1531). Keduanya
            # Fatal bila gagal — container mati, /healthz tidak pernah hijau.
            # Jadi healthz inilah penentu deploy berhasil, bukan grep log.
            echo "Menunggu /healthz..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
                echo "API sehat (t=$((i*2))s)"
                exit 0
              fi
              sleep 2
            done

            echo "ERROR: /healthz tidak merespons dalam 60s. Log terakhir:"
            docker compose -f docker-compose.prod.yml logs api --tail 60
            exit 1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ secrets.SERVER_APP_DIR }}

# =====================================================================
# CATATAN: migrasi TENANT tidak otomatis
# =====================================================================
# Yang dijalankan otomatis saat container start hanyalah migrasi + seeder
# PLATFORM. Setiap company tenant punya database sendiri dan versinya bisa
# berbeda-beda; migrasinya dijalankan per company:
#
#   docker compose -f docker-compose.prod.yml exec api \
#     ./installer migrate --company=<company-id> --config=./config/config.yaml
#
# Menambahkannya ke workflow ini berarti CI harus tahu daftar seluruh company —
# itu keputusan operasional, bukan CI, jadi sengaja dibiarkan manual.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload lampiran (lembur, dokumen) bisa besar — samakan dengan batas
    # yang diterima backend agar penolakan terjadi di satu tempat saja.
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Asset ber-hash dari Vite: aman di-cache selamanya.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API backend. Service `api` berada di network compose yang sama.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generate/preview dokumen lewat LibreOffice bisa lambat pada file
        # besar; 30s (default proxy_read_timeout) terlalu ketat.
        proxy_read_timeout 120s;
    }

    # File upload yang diserve backend di /uploads.
    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA vue-router (history mode): semua path lain jatuh ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

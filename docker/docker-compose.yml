# HRIS Platform - Multi-Database Development Environment
#
# Cara Jalankan:
#   - PostgreSQL + PgBouncer : docker compose --profile postgres up -d
#   - MySQL                  : docker compose --profile mysql up -d

networks:
  hris-network:
    driver: bridge

volumes:
  pgdata:
  mysqldata:
  redisdata:
  mailpit_data:

services:
  # ===================================================================
  # Profile: POSTGRES (+ PgBouncer)
  # ===================================================================
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    container_name: hris-postgres
    restart: unless-stopped
    networks:
      - hris-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hris_platform
      POSTGRES_USER: hris
      POSTGRES_PASSWORD: hris_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hris -d hris_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    profiles: ["postgres"]
    image: edoburu/pgbouncer:latest
    container_name: hris-pgbouncer
    restart: unless-stopped
    networks:
      - hris-network
    ports:
      - "6432:6432"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hris
      DB_PASSWORD: hris_secret
      DB_NAME: hris_platform
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "10"
      MAX_CLIENT_CONN: "500"
      RESERVE_POOL_SIZE: "0"
      RESERVE_POOL_TIMEOUT: "5.0"
      MAX_DB_CONNECTIONS: "0"
      SERVER_IDLE_TIMEOUT: "300"
      QUERY_TIMEOUT: "30"
      IGNORE_STARTUP_PARAMETERS: "extra_float_digits,search_path"
    depends_on:
      postgres:
        condition: service_healthy

  # ===================================================================
  # Profile: MYSQL
  # ===================================================================
  mysql:
    profiles: ["mysql"]
    image: mysql:8.0
    container_name: hris-mysql
    restart: unless-stopped
    networks:
      - hris-network
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: hris_platform
      MYSQL_USER: hris
      MYSQL_PASSWORD: pass123
      MYSQL_ROOT_PASSWORD: pass123
    volumes:
      - mysqldata:/var/lib/mysql
      # - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "hris", "-phris_secret"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================================
  # Shared Infrastructure (Selalu Jalan)
  # ===================================================================
  redis:
    image: redis:7-alpine
    container_name: hris-redis
    restart: unless-stopped
    networks:
      - hris-network
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: hris-mailpit
    restart: unless-stopped
    networks:
      - hris-network
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
    volumes:
      - mailpit_data:/data

  asynqmon:
    image: hibiken/asynqmon:latest
    container_name: hris-asynqmon
    restart: unless-stopped
    networks:
      - hris-network
    ports:
      - "8081:8080"
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy

  # ===================================================================
  # Go API Server
  # ===================================================================
  api:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    container_name: hris-api
    restart: unless-stopped
    networks:
      - hris-network
    ports:
      - "8082:8080"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  # ===================================================================
  # OpenTelemetry Collector (optional - uncomment to enable)
  # ===================================================================
  # otel-collector:
  #   image: otel/opentelemetry-collector-contrib:latest
  #   container_name: hris-otel

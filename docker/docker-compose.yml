  #     - "4317:4317"   # gRPC
  #     - "4318:4318"   # HTTP
  #     - "8888:8888"   # Prometheus metrics
  #   volumes:
  #     - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml
